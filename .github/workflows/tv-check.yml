name: TV check

# Run by hand: install the latest test build on Android TV emulators, drive it with the
# remote's keys, and save screenshots and any crash log. Also runs Android Lint for TV issues.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      list_images:
        description: "Only list the TV emulator images"
        required: false
        default: "false"

jobs:
  images:
    if: inputs.list_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -iE "system-images;android-[0-9]+;(android-tv|google-tv)" | sort -u

  tv:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 9 is what Fire TV (Fire OS 7) is built on; Google TV 14 is current Android TV.
        include:
          - name: android9-tv
            api: 28
            target: android-tv
            profile: tv_1080p
            script: smoke.sh
            arch: x86
          # A 1 GB TV (like a Fire TV Stick), with its memory use logged at each step.
          - name: android9-tv-1gb
            api: 28
            target: android-tv
            profile: tv_1080p
            script: smoke.sh
            arch: x86
            ram: 1024M
            heap: 128M
          - name: googletv14
            api: 34
            target: google-tv
            profile: tv_1080p
            script: smoke.sh
            arch: x86
          # A phone held upright (and turned on its side part-way), for layout checks.
          - name: phone34
            api: 34
            target: google_apis
            profile: pixel_6
            script: phone.sh
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Latest test build
        run: gh release download test-latest -p VantaView-test.apk -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          # A real TV screen (1920x1080) for TVs; a Pixel 6 screen for the phone.
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          ram-size: ${{ matrix.ram || '' }}
          heap-size: ${{ matrix.heap || '' }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/tv/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-${{ matrix.name }}
          path: tv-out
      # Also keep the screenshots on a branch, so they can be looked at without downloading artifacts.
      - name: Save screenshots to a branch (tv-results-<device>)
        if: always()
        run: |
          mkdir -p ../results && cp tv-out/*.png tv-out/*.txt ../results/ 2>/dev/null || true
          cd ../results && git init -q -b main && git add -A
          git -c user.name=tv-check -c user.email=tv-check@users.noreply.github.com commit -qm "TV check: ${{ matrix.name }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/tv-results-${{ matrix.name }}

  lint:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon lintDebug -Plint.abortOnError=false || true
      - name: Lint summary
        run: |
          f=app/build/reports/lint-results-debug.xml
          echo "== issues by type =="; grep -o 'id="[^"]*"' $f | sort | uniq -c | sort -rn
          echo "== errors and TV/focus related =="
          python3 - <<'PY'
          import re
          x=open('app/build/reports/lint-results-debug.xml').read()
          for m in re.finditer(r'<issue\s(.*?)>\s*<location\s(.*?)/>', x, re.S):
              a,l=m.group(1),m.group(2)
              g=lambda k,s: (re.search(k+r'="([^"]*)"',s) or [None,''])[1]
              sev,i=g('severity',a),g('id',a)
              if sev in ('Error','Fatal') or any(k in i for k in ('Leanback','Touchscreen','Hardware','Focus','Permission','Banner','Television')):
                  print(sev,i,'|',g('message',a)[:200],'|',g('file',l).split('/app/')[-1]+':'+g('line',l))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-debug.*
